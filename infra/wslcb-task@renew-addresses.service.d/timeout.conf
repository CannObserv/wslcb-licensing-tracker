# The daily renewal run (#195), scoped to this instance of the wslcb-task@
# template, whose timeout is infinite: a hung run would block every later
# firing. A full run is 360 rows at ~1 req/s plus answer latency, and up to 40
# no-determination rows spaced 13 s apart (~9 min); the scrape hook's
# backfill, a similar size, measures 7-10 min.
[Service]
TimeoutStartSec=90min
