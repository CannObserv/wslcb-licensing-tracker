# The daily renewal run (#195), scoped to this instance of the wslcb-task@
# template, whose timeout is infinite: a hung run would block every later
# firing. A full run is at most 80 rows (the 120 limit less the 40 reserve,
# #245) at ~1 req/s plus answer latency, and up to 10 no-determination rows
# spaced 13 s apart (~2 min). Under #195 a run was up to 360 + 40 rows; hook
# backfills of that size measured 7-10 min, so 90 min keeps a wide margin.
[Service]
TimeoutStartSec=90min
