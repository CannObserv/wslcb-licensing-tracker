# /etc/sysctl.d/60-wslcb-memory.conf — kernel memory reserve (#175). Repo name
# encodes the 60- prefix deliberately: sysctl.d applies in lexical order, so a
# cp that drops it silently changes precedence against other drop-ins.
#
# This host has 7.2 GiB and NO SWAP, and shares memory between the production
# wslcb-web.service and interactive agent sessions. Without swap, the failure
# mode past the ceiling is not a clean OOM kill: the kernel fails *atomic*
# (GFP_ATOMIC, non-sleeping) allocations in unrelated kernel paths first —
# tailscaled and ksoftirqd on CannObserv/broker, 2026-09-16 — and the network
# bus goes down while nothing is reported as killed.
#
# min_free_kbytes is the watermark the kernel keeps free for exactly those
# allocations. The stock value here was 10993 (~11 MiB), which is what the
# kernel picks from a sqrt() of RAM and is far too thin for a no-swap host
# under burst allocation. 65536 (64 MiB, ~0.9% of RAM) restores the headroom.
vm.min_free_kbytes = 65536
