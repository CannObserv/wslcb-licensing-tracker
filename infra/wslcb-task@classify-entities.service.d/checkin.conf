# The weekly entity classification's co-status dead-man check-in (#207),
# scoped to this instance: the wslcb-task@ template serves every task.
# docs/MONITORING.md § Entity classification check-in has the install order
# and the monitor.
[Unit]
# The check-in goes to co-status over the tailnet. Ordering only, no Wants=:
# a tailscale restart must not take a run down, and a check-in that fails
# is itself what the monitor alarms on.
After=tailscaled.service

[Service]
# The co-wslcb tenant's check-in key, as a credential: systemd reads the
# 0400 root:root file and hands the run a private copy under
# $CREDENTIALS_DIRECTORY, so the key is in no process environment. The file
# must exist BEFORE this drop-in is installed - a missing source fails every
# start (243/CREDENTIALS) - and stays empty until the monitor does; the run
# then warns that a stopped classification will not be noticed. The base URL
# and monitor id are no secret: the template's EnvironmentFile carries them.
LoadCredential=checkin-key:/etc/wslcb-licensing-tracker/classify-checkin.key
# The template's timeout is infinite, so a hung run would block every later
# firing for good. A capped run (5,000 names = 200 requests, 8 in flight)
# takes minutes; three consecutive failed batches stop it early.
TimeoutStartSec=1h
