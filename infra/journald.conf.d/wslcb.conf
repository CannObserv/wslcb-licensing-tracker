# #186: a persistent journal, capped at 512M.
#
# The exeuntu image (Feb 2026) masked systemd-journal-flush.service, so journald
# never left /run despite the image's own Storage=persistent, and the #184 and
# #220 reboots each lost a boot. The fix is `systemctl unmask`, not this file;
# this file keeps the setting tracked and caps the 30G root disk.
#
# 512M agrees with zz-cannobserv-journal.conf, the drop-in #200's disk-gc layer
# installs under /usr/local/lib/systemd/journald.conf.d/. journald reads every
# conf.d file in name order across /etc, /run and /usr/local/lib, and the last
# one to set a key wins: keep the two equal. That drop-in sets SystemMaxUse
# only, so this file's cap duplicates it, but its Storage=persistent is the
# repo's only tracked copy: the image's /etc/.../persistent.conf belongs to no
# package. Keep this file. Applies on restart of systemd-journald.
# docs/DEPLOYMENT.md "Journal".
[Journal]
Storage=persistent
SystemMaxUse=512M
