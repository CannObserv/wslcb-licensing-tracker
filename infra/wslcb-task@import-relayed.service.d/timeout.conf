# The relay import (#201), scoped to this instance of the wslcb-task@
# template. The operator's laptop starts it over ssh and waits for it, so a
# hung run must end. Imports take seconds; the post-import address backfill
# takes minutes (the scrape's measured 7-10 min is nearly all backfill).
#
# Deliberately no LoadCredential= and no tailnet ordering: a relay never
# checks in to co-status (docs/MONITORING.md § Relayed scrape).
[Service]
TimeoutStartSec=30min
