# #184: needrestart lists restarts, never performs them.
#
# apt's hook runs `apt-pinvoke -m u` (which calls needrestart) after every dpkg
# run, and Ubuntu's patch makes that AUTOMATIC restarts when this key is unset -
# the stock state. A
# libc6 security update would then restart wslcb-web, PostgreSQL and the
# Docker daemon under SocratiCode mid-apply, outside a window; and a Postgres
# restart 503s /api/v1/health, which wslcb-healthcheck answers by restarting
# wslcb-web itself. With the key set, needrestart prints "Disabling Ubuntu
# mode, explicit restart mode configured" and only lists. Maintainer scripts
# are out of its reach: postgresql-16 and containerd restart themselves.
# Shape from CannObserv/address-validator#237.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
