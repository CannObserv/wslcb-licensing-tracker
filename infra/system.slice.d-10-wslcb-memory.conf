# /etc/systemd/system/system.slice.d/10-wslcb-memory.conf — parent protection (#175)
#
# REQUIRED COMPANION to MemoryLow= in wslcb-web.service. Without this file that
# setting is INERT, and silently so.
#
# cgroup v2 caps a unit's effective low protection at its ancestors': the
# kernel doc is explicit that "effective low boundary is limited by memory.low
# values of all ancestor cgroups". system.slice ships with memory.low = 0, so
# min(256M, 0) = 0 and wslcb-web.service gets nothing.
#
# The usual escape hatch is the memory_recursiveprot mount option, which makes
# protection propagate without per-level configuration. It is NOT set here:
#
#   $ grep cgroup2 /proc/self/mountinfo
#   29 28 0:26 / /sys/fs/cgroup rw,relatime shared:7 - cgroup2 cgroup2 rw
#
# Bare `rw` — no memory_recursiveprot and no nsdelegate, both of which systemd
# sets when it mounts the hierarchy itself. So something else mounted it and
# systemd inherited the mount; what, exactly, has NOT been determined (PID 1 is
# systemd, and there is no exe-init process on this host). The cause is open;
# the effect is measured, and the explicit grant is the fix either way.
#
# Re-check after any base-image change: if that line ever gains
# memory_recursiveprot, this file becomes redundant rather than wrong.
#
# Sized above the single child reservation so it is not overcommitted; if
# another unit under system.slice is later given MemoryLow=, raise this to at
# least the sum, or the kernel distributes this budget proportionally between
# them and each gets less than it asks for.
[Slice]
MemoryLow=512M
