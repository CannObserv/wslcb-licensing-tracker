# The scrape's co-status dead-man check-in (#196), scoped to this instance:
# the wslcb-task@ template serves every task. docs/DEPLOYMENT.md § Scrape
# check-in has the install order and the monitor.
[Unit]
# The check-in goes to co-status over the tailnet. Ordering only, no Wants=:
# a tailscale restart must not take a scrape down, and a check-in that fails
# is itself what the monitor alarms on.
After=tailscaled.service

[Service]
# The co-wslcb tenant's check-in key, as a credential: systemd reads the
# 0400 root:root file and hands the run a private copy under
# $CREDENTIALS_DIRECTORY, so the key is in no process environment. The file
# must exist BEFORE this drop-in is installed - a missing source fails every
# start (243/CREDENTIALS) - and stays empty until the monitor does; the run
# then warns that a stopped scrape will not be noticed. The base URL and
# monitor id are no secret: the template's EnvironmentFile carries them.
LoadCredential=checkin-key:/etc/wslcb-licensing-tracker/scrape-checkin.key
# The template's timeout is infinite, so a hung run would block every later
# firing for good. Runs take 7-10 min, nearly all of it the post-scrape
# address backfill; the check-in goes before it.
TimeoutStartSec=2h
